<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIMBA - Desa Madu Sari</title>
    <style>
        /* Tema Warna Cokelat dan Krem (Senada dengan Dashboard) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F9F6F0; /* Putih gading / krem lembut khas nuansa tanah */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Kotak login utama */
        .login-card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(92, 64, 51, 0.1);
            border-top: 5px solid #5C4033;
        }

        /* Header logo dan judul */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #5C4033; /* Cokelat Tanah */
            font-size: 32px;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .login-header p {
            color: #795548;
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        /* Grup form masukan */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5C4033;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #D7CCC8;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #FAFAFA;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #5C4033;
            box-shadow: 0 0 5px rgba(92, 64, 51, 0.3);
            background-color: #FFFFFF;
        }

        /* Tombol login */
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #5C4033;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-btn:hover {
            background-color: #7B4B3A;
        }

        /* Teks bantuan di bawah */
        .help-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #8D6E63;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>SIMBA</h1>
            <p>Sistem Inovasi Memantau Tinggi Muka Air Tanah Lahan Gambut<br><b>Desa Madu Sari</b></p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username Anda" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password Anda" required>
            </div>

            <div class="form-group">
                <label for="role">Masuk Sebagai</label>
                <select id="role" required>
                    <option value="" disabled selected>Pilih Peran Anda...</option>
                    <option value="penyuluh">Penyuluh Pertanian</option>
                    <option value="dinas">Dinas Pertanian Madu Sari</option>
                    <option value="autp">Petugas Asuransi AUTP</option>
                    <option value="akademisi">Peneliti / Akademisi</option>
                </select>
            </div>

            <button type="submit" class="login-btn">Masuk ke Sistem</button>
        </form>

        <div class="help-text">
            Butuh bantuan akses? Hubungi Admin SIGAP.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;

            if (role === 'penyuluh') {
                alert('Selamat datang, ' + username + '! Mengarahkan ke Dashboard Penyuluh Pertanian...');
            } else if (role === 'dinas') {
                alert('Selamat datang, ' + username + '! Mengarahkan ke Dashboard Dinas Pertanian...');
                // window.location.href = 'dinas-dashboard.html';
            } else if (role === 'autp') {
                alert('Selamat datang, ' + username + '! Mengarahkan ke Dashboard Asuransi AUTP...');
            } else if (role === 'akademisi') {
                alert('Selamat datang, ' + username + '! Mengarahkan ke Dashboard Peneliti...');
            }
        });
    </script>

</body>
</html>
