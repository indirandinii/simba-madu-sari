<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SIMBA - Desa Madu Sari</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #F9F6F0; /* Warna latar senada dengan dashboard */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(92, 64, 51, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid #5C4033;
            text-align: center;
        }

        .brand-title {
            margin: 0;
            font-size: 32px;
            color: #5C4033;
            font-weight: bold;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            margin-top: 5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #5C4033;
            margin-bottom: 8px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #8D4004;
            box-shadow: 0 0 5px rgba(141, 64, 4, 0.2);
        }

        .btn-login {
            background-color: #8D4004;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #6E3103;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1 class="brand-title">SIMBA</h1>
        <p class="brand-subtitle">Sistem Informasi Monitoring Lahan Gambut<br>Desa Madu Sari</p>

        <!-- FORM LOGIN -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" placeholder="Masukkan username..." required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password..." required>
            </div>

            <div class="input-group">
                <label for="role">Masuk Sebagai (Pilih Akses / Role)</label>
                <select id="role" required>
                    <option value="" disabled selected>-- Pilih Peran --</option>
                    <option value="dinas">Dinas Pertanian</option>
                    <option value="penyuluh">Penyuluh Pertanian</option>
                    <option value="autp">Petugas Asuransi (AUTP)</option>
                    <option value="akademisi">Peneliti / Akademisi</option>
                </select>
            </div>

            <button type="submit" class="btn-login">Masuk ke Dashboard</button>
        </form>

        <p class="footer-text">© 2026 - Pilot Project Desa Madu Sari</p>
    </div>

    <script>
        function handleLogin(event) {
            // Mencegah form melakukan refresh halaman bawaan
            event.preventDefault();

            // Mengambil nilai role yang dipilih dari dropdown
            const roleSelect = document.getElementById('role').value;

            if (roleSelect) {
                // Menyimpan role ke dalam localStorage browser
                localStorage.setItem('simba_role', roleSelect);
                
                // Mengarahkan ke file dashboard.html
                window.location.href = 'dashboard.html';
            } else {
                alert("Harap pilih peran (role) terlebih dahulu!");
            }
        }
    </script>
</body>
</html>
